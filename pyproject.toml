[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nostr-hermes-proxy"
version = "0.1.0"
description = "NIP-17 Nostr DM proxy for the local Hermes gateway"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "nostrbot-sdk @ git+https://github.com/unsaltedbutter-ai/nostrbot-sdk.git@v0.8.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.scripts]
nostr-send = "nostr_hermes_proxy.send_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["nostr_hermes_proxy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:nostr_hermes_proxy.*",
]
