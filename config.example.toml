# nostr-hermes-proxy configuration example.
#
# Copy to ~/.config/nostr-hermes-proxy/config.toml (chmod 600) and replace the
# placeholders. Never put an nsec in this file: secrets are environment
# variables expanded from ${VAR} (see the LaunchAgent's 0600 env file).
#
# Required environment:
#   HERMES_API_KEY   the Hermes gateway's API_SERVER_KEY value
#   NSEC_<NAME>      one nsec per personality (e.g. NSEC_ATLAS)

hermes_url = "http://127.0.0.1:8642"

# The owner's mobile npub. Exactly one sender is allowed per personality;
# everyone else is dropped and logged. Accepts npub1... or 64-char hex.
allow_npub = "npub1REPLACE_WITH_OWNER_NPUB"

# Immediate ack: every accepted non-command DM gets this text as its own DM,
# carrying a short NIP-40 expiration (minimum TTL 60 seconds).
ack_text = "👀"
ack_ttl_seconds = 1200

# Context totals are read live from the gateway's config.yaml on every
# /new and /status — no proxy-side table to maintain. Override the path
# only if your Hermes config lives somewhere unusual:
# hermes_config_path = "~/.hermes/config.yaml"

# Defaults to ~/.local/state/nostr-hermes-proxy/
# state_dir = "~/.local/state/nostr-hermes-proxy"

# Outbound control plane for cron jobs and nostr-send. It binds 127.0.0.1
# only; set control_port = 0 to disable it. The bearer token file is
# generated (mode 0600) on first start when missing.
control_port = 8787
# control_token_path = "~/.config/nostr-hermes-proxy/control-token"
# Politeness cap per personality, shared by cron jobs and the CLI.
# outbound_rate_limit_per_minute = 10
# Maximum (and default) outbound NIP-40 expiry; requests clamp into [60, this].
# outbound_expiry_max_seconds = 604800

# Optional defaults shared by every personality. The first relay should be
# nos.lol; relay hygiene orders it first automatically.
# relays = ["wss://nos.lol", "wss://relay.damus.io"]

# Watchdog knobs. The proxy polls each bot every interval; after N consecutive
# unhealthy cycles it exits so the LaunchAgent can restart it. Bots without
# health hooks (nostrbot-sdk v0.5.2) are reported as "no health hook".
# watchdog_interval_seconds = 60
# watchdog_failure_threshold = 3
# watchdog_stall_seconds = 7200

[[personality]]
name = "atlas"
nsec = "${NSEC_ATLAS}"
relays = ["wss://nos.lol", "wss://relay.damus.io"]
# model = "anthropic/claude-sonnet-4"
# provider = "openrouter"
# Optional kind-0 metadata published on connect. Allowed keys: name
# (display-name override), about, picture, nip05, lud16, website.
# [personality.profile]
# about = "I help bitcoiners mix their coins trustlessly over Nostr."
# lud16 = "nostrmix-bot@pay.example"
# nip05 = "nostrmix-bot@example"
# picture = "https://example/bot.png"
# website = "https://example"
# name = "Fancy Display Name"

